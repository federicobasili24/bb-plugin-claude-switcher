name: check

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # dist/ must be the build of this tree (bb rebuilds it at install time;
      # the committed copy is for review).
      # The exact bb version matters: server.meta.json stamps it.
      - run: npm install -g bb-app@0.45.0
      - run: bb plugin types --check
      - run: npm run build
      # Say which file differs, and how, before failing. Not on the fork's
      # `windows` branch: its dist/ stays upstream's until a Linux rebuild.
      - if: github.ref != 'refs/heads/windows'
        run: git diff --stat -- dist && git diff -U0 -- dist/server.meta.json dist/app.meta.json && test -z "$(git status --porcelain -- dist)"

  # The plugin on a Windows bb server. dist/ is built on Linux only: bb-app
  # does not install on Windows.
  test-windows:
    runs-on: windows-latest
    steps:
      # Tests read sources byte for byte: no CRLF conversion on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
